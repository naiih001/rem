[package]
name = "rem"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = "0.42"
cursive = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
dotenvy = "0.15"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
html-escape = "0.2"
